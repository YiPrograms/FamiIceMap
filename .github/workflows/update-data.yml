name: Update store data

on:
  schedule:
    # 官方說明每週三更新；UTC 12:30 = 台灣時間週三 20:30。
    - cron: "30 12 * * 3"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update-store-data
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run parser tests
        run: npm test

      - name: Fetch official store data
        run: npm run update-data

      - name: Validate generated data
        run: npm run check

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/stores.json
          if git diff --cached --quiet; then
            echo "Store data is unchanged."
          else
            git commit -m "chore(data): update FamilyMart stores"
            git push
          fi

      # Commits created with GITHUB_TOKEN do not trigger another workflow, so
      # the scheduled updater deploys the freshly generated artifact directly.
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy updated data to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
